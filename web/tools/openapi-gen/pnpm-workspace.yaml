# Supply-chain policy (AGENTS.md): never install a release younger than 24 hours.
minimumReleaseAge: 1440
# Install scripts are denied unless listed here. @scarf/scarf (a dependency of swagger-ui-dist) only
# sends install analytics, and vue-demi's script is not needed for the prebuilt bundles we copy.
allowBuilds:
  "@scarf/scarf": false
  vue-demi: false
