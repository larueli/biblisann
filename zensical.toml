# Documentation site (ADR 0012). Build: make docs. Serve: make docs-serve.
[project]
site_name = "Biblisann"
site_description = "Self-hosted manager for your physical book library"
site_url = "https://larueli.github.io/biblisann/"
repo_url = "https://github.com/larueli/biblisann"
repo_name = "larueli/biblisann"
copyright = "AGPL-3.0-or-later"
docs_dir = "docs"
site_dir = "site"
# Agent working files are not part of the published site.
exclude_docs = """
HANDOFF.md
agents.md
agents/
prompts/
overrides/
"""
extra_css = ["stylesheets/landing.css"]
nav = [
  { "Home" = "index.md" },
  { "User guide" = [
    { "Overview" = "user/index.md" },
    { "Install" = "user/install.md" },
    { "Configuration" = "user/configuration.md" },
  ] },
  { "Developers" = [
    { "Architecture" = "dev/architecture.md" },
    { "GitHub setup" = "dev/github.md" },
    { "Versioning and releases" = "dev/versioning.md" },
    { "Windows setup" = "dev/setup-windows.md" },
  ] },
  { "Project" = [
    { "Specification" = "spec.md" },
    { "Roadmap" = "roadmap.md" },
  ] },
]

[project.theme]
language = "en"
custom_dir = "docs/overrides"
logo = "assets/logo.svg"
favicon = "assets/logo.svg"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
