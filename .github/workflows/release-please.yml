name: release

# The releaser. On every push to main, release-please reads the Conventional Commits since the
# last release and keeps ONE release PR up to date (next SemVer version + CHANGELOG.md).
# Merging that PR creates the tag and the GitHub Release; this same run then builds and
# publishes the image and chart by calling publish.yml. Nothing is published on a plain commit.
#
# Token: with the default GITHUB_TOKEN, GitHub does not start CI on the release PR. The
# releaser therefore authenticates as a GitHub App (ADR 0009): set the repository variable
# RELEASE_APP_ID and the secret RELEASE_APP_PRIVATE_KEY (see docs/dev/github.md). Until the App
# exists the workflow falls back to GITHUB_TOKEN and the release PR needs a manual CI re-run.
# Publishing works either way because it is called from here instead of a tag trigger.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: app
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
