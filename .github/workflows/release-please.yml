name: release

# The releaser. On every push to main, release-please reads the Conventional Commits since the
# last release and keeps ONE release PR up to date (next SemVer version + CHANGELOG.md).
# Merging that PR creates the tag and the GitHub Release; this same run then builds and
# publishes the image and chart by calling publish.yml. Nothing is published on a plain commit.
#
# Token: with the default GITHUB_TOKEN, GitHub does not start CI on the release PR and does not
# trigger tag workflows. Set the secret RELEASE_PLEASE_TOKEN (GitHub App token or fine-grained
# PAT with contents + pull-requests write) so release PRs run CI. Publishing works either way
# because it is called from here instead of relying on a tag trigger.
# TODO(Slice 0): pin actions by commit SHA.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
