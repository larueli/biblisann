name: publish

# Builds and publishes the container image and Helm chart for an EXISTING version tag.
# Called by release-please.yml after a release is created; can also be run by hand to
# republish a tag (Actions > publish > Run workflow).
# TODO(Slice 0): pin every action by commit SHA.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to publish, for example v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to (re)publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a SemVer tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Compute lowercase image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check for Dockerfile
        id: detect
        run: echo "present=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-qemu-action@v3
      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.detect.outputs.present == 'true'
        uses: sigstore/cosign-installer@v3

      - if: steps.detect.outputs.present == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.detect.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ !contains(inputs.tag, '-') }}
            type=sha

      - if: steps.detect.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the image by digest (keyless)
        if: steps.detect.outputs.present == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: image
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Check for chart
        id: detect
        run: echo "present=$([ -f deploy/helm/biblisann/Chart.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.present == 'true'
        uses: azure/setup-helm@v4

      - name: Package and push chart to GHCR (OCI)
        if: steps.detect.outputs.present == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm package deploy/helm/biblisann --version "${version}" --app-version "${version}"
          helm push "biblisann-${version}.tgz" "oci://${repo}"
