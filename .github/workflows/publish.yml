name: publish

# Builds and publishes the container image and Helm chart for an EXISTING version tag.
# Called by release-please.yml after a release is created; can also be run by hand to
# republish a tag (Actions > publish > Run workflow).
# Every action is pinned by commit SHA. The jobs that push or sign run in the `publish` environment,
# which only the main branch may deploy to. That stops an accidental dispatch from another ref, not
# a collaborator who edits this file: users rely on `cosign verify` with the main identity.

on:
  workflow_call:
    inputs:
      tag:
        description: Version tag to publish, for example v0.1.0
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to (re)publish, for example v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    environment: publish # limited to main (docs/dev/github.md): stops a dispatch from another ref
    permissions:
      contents: read
      packages: write   # push to GHCR
      id-token: write   # cosign keyless signing
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "not a SemVer tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }} # full ref: a branch named like the tag must never win
          fetch-depth: 0 # all history and tags: a shallow fetch would only see this tag
          fetch-tags: true # needed to know whether this tag is the newest of its line
          persist-credentials: false

      # Floating tags move only when this really is the newest stable release of their line, so
      # republishing an old tag can never move `latest`, `X` or `X.Y` backwards.
      - name: Decide which floating tags this release may move
        id: floating
        env:
          TAG: ${{ inputs.tag }}
        run: |
          newest() { git tag -l "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1; }
          major="${TAG#v}"; major="${major%%.*}"
          minor="${TAG#v}"; minor="${minor%.*}"
          stable=false; [[ "$TAG" != *-* ]] && stable=true
          out() { echo "$1=$([ "$stable" = true ] && [ "$(newest "$2")" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"; }
          out latest 'v*'
          out major "v${major}.*"
          out minor "v${minor}.*"
          cat "$GITHUB_OUTPUT"

      - name: Compute lowercase image name
        id: names
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Check for Dockerfile
        id: detect
        run: echo "present=$([ -f Dockerfile ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - if: steps.detect.outputs.present == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.detect.outputs.present == 'true'
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - if: steps.detect.outputs.present == 'true'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.detect.outputs.present == 'true'
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.names.outputs.image }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.tag }},enable=${{ steps.floating.outputs.minor == 'true' }}
            type=semver,pattern={{major}},value=${{ inputs.tag }},enable=${{ steps.floating.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.floating.outputs.latest == 'true' }}
            type=sha

      - if: steps.detect.outputs.present == 'true'
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
          provenance: mode=max
          sbom: true
          # No shared build cache: the released image is built from scratch.

      - name: Sign the image by digest (keyless)
        if: steps.detect.outputs.present == 'true'
        env:
          IMAGE: ${{ steps.names.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

  chart:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: image
    environment: publish
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }} # full ref: a branch named like the tag must never win
          persist-credentials: false

      - name: Check for chart
        id: detect
        run: echo "present=$([ -f deploy/helm/biblisann/Chart.yaml ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - if: steps.detect.outputs.present == 'true'
        uses: azure/setup-helm@2f5e7bc67f1f9972ab16657bb795f36d8f04de0e # v5.1.0
      - name: Package and push chart to GHCR (OCI)
        if: steps.detect.outputs.present == 'true'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          repo="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/charts"
          echo "${GHCR_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm package deploy/helm/biblisann --version "${version}" --app-version "${version}"
          helm push "biblisann-${version}.tgz" "oci://${repo}"
