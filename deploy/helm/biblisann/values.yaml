# Default values. Everything here passes the "restricted" Pod Security Standard.

image:
  repository: ghcr.io/larueli/biblisann
  # Empty: use the chart appVersion. Prefer pinning a digest in production.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

replicaCount: 1

# Public origin of the service (scheme and host only). Required for cookies, OAuth and passkeys.
baseUrl: http://localhost:8080
# CIDRs of reverse proxies allowed to set X-Forwarded-For (for example the ingress controller).
trustedProxies: []

logLevel: info
logFormat: json

database:
  # "external": a PostgreSQL you run. "cnpg": a CloudNativePG Cluster created by this chart
  # (the CloudNativePG operator must be installed).
  mode: external
  external:
    # Secret holding the connection URL, mounted as a file (BIBLISANN_DATABASE_URL_FILE).
    existingSecret: ""
    key: database-url
  cnpg:
    instances: 1
    storage:
      size: 5Gi
      storageClassName: ""
    imageName: ""

# Covers are stored under /data. Without persistence they live in an emptyDir and are lost when
# the pod is replaced: enable it, or use S3-compatible storage once available.
persistence:
  enabled: false
  size: 2Gi
  storageClassName: ""
  existingClaim: ""

# Who may register: first-user (only the first account), open, closed.
registration: first-user
# Default ordered metadata providers and providers disabled for everyone.
providers: [bnf, openlibrary]
disabledProviders: []

# Extra environment, for SMTP, S3, Web Push and other settings (docs/user/configuration.md).
# Sensitive values belong in a Secret: use extraEnvFrom or valueFrom.secretKeyRef.
extraEnv: []
extraEnvFrom: []

# Prometheus metrics at /metrics. The route does not exist unless you give it a bearer token
# (tokenSecret) or declare it public (public: true, only when something else protects it, such as a
# NetworkPolicy or the ingress). OpenTelemetry traces: set OTEL_EXPORTER_OTLP_ENDPOINT through extraEnv.
# tokenSecret references an existing Secret (sops, sealed secrets, external-secrets...): the key is
# mounted as a file (BIBLISANN_METRICS_TOKEN_FILE), never put in the environment.
# Scratch space for imports (covers are spooled to a temporary directory; the root filesystem is read-only).
# Size it for the largest archive you accept (64 MiB) times concurrent imports (2).
tmpSizeLimit: 256Mi

metrics:
  tokenSecret: {name: "", key: token}
  public: false
  serviceMonitor:
    enabled: false   # needs the Prometheus Operator CRDs
    interval: 30s

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: books.example.org
  tls:
    secretName: ""

resources:
  requests:
    cpu: 20m
    memory: 64Mi
  limits:
    memory: 256Mi

podDisruptionBudget:
  enabled: false
  minAvailable: 1

networkPolicy:
  # Ingress to the app only from the namespaces/pods you select. Disabled by default because
  # selectors depend on the cluster.
  enabled: false
  ingressFrom: []

serviceAccount:
  create: true
  annotations: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
