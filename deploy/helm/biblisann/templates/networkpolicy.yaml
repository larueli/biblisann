{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingressFrom }}
{{- fail "networkPolicy.ingressFrom must list who may reach the pod: an empty list would allow everyone" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "biblisann.fullname" . }}
  labels: {{- include "biblisann.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels: {{- include "biblisann.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - from: {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: 8080
{{- end }}
