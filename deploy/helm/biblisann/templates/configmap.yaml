apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "biblisann.fullname" . }}
  labels: {{- include "biblisann.labels" . | nindent 4 }}
data:
  BIBLISANN_LISTEN_ADDR: ":8080"
  BIBLISANN_BASE_URL: {{ .Values.baseUrl | quote }}
  BIBLISANN_TRUSTED_PROXIES: {{ join "," .Values.trustedProxies | quote }}
  BIBLISANN_LOG_LEVEL: {{ .Values.logLevel | quote }}
  BIBLISANN_LOG_FORMAT: {{ .Values.logFormat | quote }}
  BIBLISANN_REGISTRATION: {{ .Values.registration | quote }}
  BIBLISANN_PROVIDERS: {{ join "," .Values.providers | quote }}
  BIBLISANN_DISABLED_PROVIDERS: {{ join "," .Values.disabledProviders | quote }}
  BIBLISANN_COVERS_DIR: /data/covers
  BIBLISANN_METRICS_PUBLIC: {{ .Values.metrics.public | quote }}
