apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "biblisann.fullname" . }}
  labels: {{- include "biblisann.labels" . | nindent 4 }}
data:
  BIBLISANN_LISTEN_ADDR: ":8080"
  BIBLISANN_BASE_URL: {{ .Values.baseUrl | quote }}
  BIBLISANN_TRUSTED_PROXIES: {{ join "," .Values.trustedProxies | quote }}
  BIBLISANN_LOG_LEVEL: {{ .Values.logLevel | quote }}
  BIBLISANN_LOG_FORMAT: {{ .Values.logFormat | quote }}
