# Hook runner: prek (https://github.com/j178/prek). This file is pre-commit compatible, so the
# original `pre-commit` can run it too (no lock-in).
#
#   make hooks   install git hooks once per clone (pre-commit, commit-msg, pre-push)
#   make check   run every hook at both stages; this is exactly what CI runs
#
# Stages: fast checks run on commit; slow checks (tests, vulnerability scan, web build) run on push.
# Every `rev` is frozen to a commit SHA (`prek update --freeze`).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        # Helm templates are Go templates, pnpm-lock.yaml is multi-document: both are valid for their tools.
        exclude: '^(deploy/helm/[^/]+/templates/|web/pnpm-lock\.yaml$)'
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  # Conventional Commits (see docs/dev/versioning.md). Also used by CI to check PR titles.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, perf, refactor, docs, test, build, ci, chore, revert]

  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  # Workflow security audit (all Actions are pinned by SHA).
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 0eb9e4a60caf04df64b499ed1e8bef55f4440eae  # frozen: v1.33.0
    hooks:
      - id: zizmor

  # Project checks live in the Makefile so humans, agents and CI call the same commands.
  - repo: local
    hooks:
      - id: docs-check
        name: agent docs consistency
        entry: scripts/check-docs.sh
        language: system
        pass_filenames: false
        always_run: true

      - id: personal-data
        name: no personal data (emails, IPs, home paths)
        entry: bash -c 'scripts/check-personal-data.sh --self-test && scripts/check-personal-data.sh'
        language: system
        pass_filenames: false
        always_run: true

      - id: lint
        name: lint (Go and web)
        entry: make lint
        language: system
        pass_filenames: false
        files: '(\.(go|ts|tsx|js|jsx|css)$|^go\.(mod|sum)$|^web/package\.json$)'

      - id: generate-check
        name: generated files are up to date
        entry: make generate-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: test
        name: Go tests
        entry: make test
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: vuln
        name: Go vulnerability scan
        entry: make vuln
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: web-check
        name: web typecheck, tests, build
        entry: make web-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
